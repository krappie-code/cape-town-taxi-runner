name: Deploy to GitHub Pages

on:
  push:
    branches: [main, feat/isometric-graphics-upgrade]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  export-web:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4
    steps:
      - uses: actions/checkout@v4

      - name: Setup export templates
        run: |
          # Find where templates actually are in this container
          GODOT_VERSION="4.4.stable"
          TEMPLATE_DIR="/github/home/.local/share/godot/export_templates/${GODOT_VERSION}"
          mkdir -p "${TEMPLATE_DIR}"
          # barichello/godot-ci stores templates in /root
          if [ -d "/root/.local/share/godot/export_templates/${GODOT_VERSION}" ]; then
            cp -r /root/.local/share/godot/export_templates/${GODOT_VERSION}/* "${TEMPLATE_DIR}/" 2>/dev/null || true
          fi
          # Also try finding them anywhere
          find / -name "web_*release*" -o -name "web_*debug*" 2>/dev/null | head -10 || true
          ls -la "${TEMPLATE_DIR}/" 2>/dev/null || echo "Template dir empty"
          # If templates missing, download them
          if [ ! -f "${TEMPLATE_DIR}/web_nothreads_release.zip" ]; then
            echo "Downloading export templates..."
            DOWNLOAD_URL="https://github.com/godotengine/godot/releases/download/4.4-stable/Godot_v4.4-stable_export_templates.tpz"
            curl -fsSL "${DOWNLOAD_URL}" -o /tmp/templates.tpz
            cd /tmp && unzip -o templates.tpz
            cp -r /tmp/templates/* "${TEMPLATE_DIR}/"
            ls -la "${TEMPLATE_DIR}/"
          fi

      - name: Import project
        run: |
          cd godot
          godot --headless --import 2>&1 || true
          timeout 30 godot --headless --editor --quit 2>&1 || true

      - name: Export to HTML5
        run: |
          mkdir -p build/web
          cd godot
          godot --headless --export-release "Web" ../build/web/index.html 2>&1

      - name: Add coi-serviceworker for SharedArrayBuffer
        run: |
          cd build/web
          # Godot 4 web exports need SharedArrayBuffer (COOP/COEP headers)
          curl -fsSL https://raw.githubusercontent.com/nicolo-ribaudo/coi-serviceworker/refs/heads/master/coi-serviceworker.min.js -o coi-serviceworker.min.js
          sed -i 's|<head>|<head><script src="coi-serviceworker.min.js"></script>|' index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: export-web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
