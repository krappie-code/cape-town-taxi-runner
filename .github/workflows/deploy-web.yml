name: Deploy to GitHub Pages

on:
  push:
    branches: [main, feat/isometric-graphics-upgrade]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  export-web:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4
    steps:
      - uses: actions/checkout@v4

      - name: Setup export templates
        run: |
          GODOT_VERSION="4.4.stable"
          # Godot looks in $HOME/.local/share/godot/export_templates/
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}"
          mkdir -p "${TEMPLATE_DIR}"
          # Copy from /root where barichello/godot-ci installs them
          if [ -d "/root/.local/share/godot/export_templates/${GODOT_VERSION}" ]; then
            cp -r /root/.local/share/godot/export_templates/${GODOT_VERSION}/* "${TEMPLATE_DIR}/"
          fi
          # Verify
          ls "${TEMPLATE_DIR}/web_nothreads_release.zip" && echo "Templates ready" || {
            echo "Downloading export templates..."
            curl -fsSL "https://github.com/godotengine/godot/releases/download/4.4-stable/Godot_v4.4-stable_export_templates.tpz" -o /tmp/templates.tpz
            cd /tmp && unzip -o templates.tpz
            cp -r /tmp/templates/* "${TEMPLATE_DIR}/"
          }
          echo "HOME=$HOME"
          echo "Template dir: ${TEMPLATE_DIR}"
          ls "${TEMPLATE_DIR}/web_nothreads_release.zip"

      - name: Import project
        run: |
          cd godot
          godot --headless --import 2>&1 || true
          timeout 30 godot --headless --editor --quit 2>&1 || true

      - name: Validate project
        run: |
          cd godot
          echo "=== Checking resources ==="
          godot --headless --script res://scripts/export_check.gd 2>&1 || true
          echo "=== Template check ==="
          ls -la $HOME/.local/share/godot/export_templates/4.4.stable/web_nothreads* || echo "NO nothreads templates"
          ls -la $HOME/.local/share/godot/export_templates/4.4.stable/web_debug* || echo "NO debug templates"
          ls -la $HOME/.local/share/godot/export_templates/4.4.stable/web_release* || echo "NO release templates"
          echo "=== Export preset ==="
          cat export_presets.cfg

      - name: Export to HTML5
        run: |
          mkdir -p build/web
          cd godot
          godot --headless --export-release "Web" ../build/web/index.html 2>&1; EXIT=$?
          if [ $EXIT -ne 0 ]; then
            echo "=== Release export failed (exit $EXIT), trying debug ==="
            godot --headless --export-debug "Web" ../build/web/index.html 2>&1 || true
            echo "=== Checking if output was created anyway ==="
            ls -la ../build/web/ || true
          fi
          # Verify output exists
          test -f ../build/web/index.html

      - name: Add coi-serviceworker for SharedArrayBuffer
        run: |
          cd build/web
          # Godot 4 web exports need SharedArrayBuffer (COOP/COEP headers)
          curl -fsSL https://raw.githubusercontent.com/nicolo-ribaudo/coi-serviceworker/refs/heads/master/coi-serviceworker.min.js -o coi-serviceworker.min.js
          sed -i 's|<head>|<head><script src="coi-serviceworker.min.js"></script>|' index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: export-web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
