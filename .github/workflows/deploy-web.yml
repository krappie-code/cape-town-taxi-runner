name: Deploy to GitHub Pages

on:
  push:
    branches: [main, feat/isometric-graphics-upgrade]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  export-web:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4
    steps:
      - uses: actions/checkout@v4

      - name: Setup export templates
        run: |
          mkdir -p /root/.local/share/godot/export_templates/4.4.stable
          mv /root/.local/share/godot/export_templates/4.4.stable.mono /root/.local/share/godot/export_templates/4.4.stable 2>/dev/null || true
          # Templates come pre-installed in barichello/godot-ci
          ls /root/.local/share/godot/export_templates/ || true

      - name: Import project
        run: |
          cd godot
          godot --headless --import 2>&1 || true
          timeout 30 godot --headless --editor --quit 2>&1 || true

      - name: Export to HTML5
        run: |
          mkdir -p build/web
          cd godot
          godot --headless --export-release "Web" ../build/web/index.html 2>&1

      - name: Add coi-serviceworker for SharedArrayBuffer
        run: |
          cd build/web
          # Godot 4 web exports need SharedArrayBuffer (COOP/COEP headers)
          curl -fsSL https://raw.githubusercontent.com/nicolo-ribaudo/coi-serviceworker/refs/heads/master/coi-serviceworker.min.js -o coi-serviceworker.min.js
          sed -i 's|<head>|<head><script src="coi-serviceworker.min.js"></script>|' index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: export-web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
